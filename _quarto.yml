project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - about.qmd
    - Hands-on_Ex/**/*.qmd
    - In-class_Ex/**/*.qmd

website:
  title: "ISSS626 Geospatial Analytics"
  description: "Coursework website — SMU MITB, AY2026-27 August Term"
  site-url: "https://isss626-gaa.vercel.app"
  navbar:
    background: primary
    search: true
    left:
      - text: "Home"
        href: index.qmd
      - text: "Hands-on Exercises"
        menu:
          - text: "Hands-on Ex 1: Geospatial Data Wrangling & Choropleth Mapping"
            href: Hands-on_Ex/Hands-on_Ex01/Hands-on_Ex01.qmd
          - text: "Hands-on Ex 2: Spatial Point Patterns Analysis"
            href: Hands-on_Ex/Hands-on_Ex02/Hands-on_Ex02.qmd
          - text: "Hands-on Ex 3: Spatio-Temporal Point Patterns Analysis"
            href: Hands-on_Ex/Hands-on_Ex03/Hands-on_Ex03.qmd
          - text: "Hands-on Ex 4: Spatial Weights and Applications"
            href: Hands-on_Ex/Hands-on_Ex04/Hands-on_Ex04.qmd
          - text: "Hands-on Ex 5: Global and Local Measures of Spatial Autocorrelation"
            href: Hands-on_Ex/Hands-on_Ex05/Hands-on_Ex05.qmd
      - text: "In-class Exercises"
        menu:
          - text: "In-class Ex 4: Spatial Weights and Applications"
            href: In-class_Ex/In-class_Ex04/In-class_Ex04.qmd
      - text: "Take-home Exercises"
        menu:
          - text: "(none yet)"
            href: index.qmd
    right:
      - text: "About"
        href: about.qmd
      - icon: github
        href: https://github.com/ngdvol/ISSS626-GAA
        aria-label: GitHub

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    css: styles.css
    toc: true
    toc-depth: 4
    toc-title: "On this page"
    toc-expand: true
    code-fold: false
    code-copy: true
    code-overflow: wrap
    code-line-numbers: false
    fig-align: center
    number-sections: true
    smooth-scroll: true
    grid:
      body-width: 820px
      margin-width: 345px
      gutter-width: 1.4rem

execute:
  freeze: auto
  warning: false
  message: false

editor: visual
